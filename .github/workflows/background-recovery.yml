name: Background recovery
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    environment: people-hub-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        job:
          - leave-notifications
          - check-in-reminders
          - new-starter-day-one
          - onboarding-credentials
          - scheduled-offboarding
          - leave-priority-reminders
    concurrency:
      group: people-hub-background-recovery-${{ matrix.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover queued notifications
        env:
          MAM_PEOPLE_HUB_CRON_SECRET: ${{ secrets.MAM_PEOPLE_HUB_CRON_SECRET }}
          MAM_RECOVERY_JOB: ${{ matrix.job }}
        run: node scripts/recover-background-jobs.mjs "$MAM_RECOVERY_JOB"
