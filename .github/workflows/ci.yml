name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test notification transaction and credential audit in disposable database
        env:
          PGPASSWORD: synthetic-ci-only
        run: >-
          psql -h localhost -U postgres -d security_test -v ON_ERROR_STOP=1
          -f tests/security-remediation-bootstrap.sql
          -f supabase/migrations/20260908015416_security_notification_outbox_and_grant_audit.sql
          -f tests/security-remediation.sql
