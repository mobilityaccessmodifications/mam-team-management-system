name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  security-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test service-only OpenClaw allowlist snapshot with synthetic data
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres openclaw_allowlist_test
          psql -h localhost -U postgres -d openclaw_allowlist_test -v ON_ERROR_STOP=1 -f tests/openclaw-allowlist.sql
      - name: Test employee email login and unchanged administrator credentials
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres employee_email_login_test
          psql -h localhost -U postgres -d employee_email_login_test -v ON_ERROR_STOP=1 -f tests/employee-email-login.sql
      - name: Test notification transaction and credential audit in disposable database
        env:
          PGPASSWORD: synthetic-ci-only
        run: >-
          psql -h localhost -U postgres -d security_test -v ON_ERROR_STOP=1
          -f tests/security-remediation-bootstrap.sql
          -f supabase/migrations/20260908015416_security_notification_outbox_and_grant_audit.sql
          -f tests/security-remediation.sql
          -f tests/leave-email-balances.sql

      - name: Test reviewer balance permissions in disposable database
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres reviewer_balance_test
          psql -h localhost -U postgres -d reviewer_balance_test -v ON_ERROR_STOP=1 -f tests/reviewer-balance-access.sql

      - name: Test advisor security cleanup in disposable database
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres advisor_cleanup_test
          psql -h localhost -U postgres -d advisor_cleanup_test -v ON_ERROR_STOP=1 \
            -f tests/advisor-security-cleanup-bootstrap.sql \
            -f supabase/migrations/20260915010000_advisor_security_and_policy_cleanup.sql \
            -f tests/advisor-security-cleanup.sql

      - name: Test serialised portal account status changes in disposable database
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres portal_account_status_test
          psql -h localhost -U postgres -d portal_account_status_test -v ON_ERROR_STOP=1 \
            -f tests/portal-account-status-claim-bootstrap.sql \
            -f supabase/migrations/20260916120000_serialise_portal_account_status_changes.sql \
            -f tests/portal-account-status-claim.sql

      - name: Test personal Calendar scope and explicit approved-leave viewers
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres personal_calendar_scope_test
          psql -h localhost -U postgres -d personal_calendar_scope_test -v ON_ERROR_STOP=1 \
            -f tests/personal-calendar-scope-bootstrap.sql \
            -f supabase/migrations/20260916130000_personal_calendar_scope.sql \
            -f tests/personal-calendar-scope.sql

      - name: Test private employee and manager-team birthday scope
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres private_team_birthdays_test
          psql -h localhost -U postgres -d private_team_birthdays_test -v ON_ERROR_STOP=1 \
            -f tests/private-team-birthdays-bootstrap.sql \
            -f supabase/migrations/20260916140000_private_team_calendar_birthdays.sql \
            -f tests/private-team-birthdays.sql

      - name: Test full-time duration and approved-leave balance deductions
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres leave_duration_balance_test
          psql -h localhost -U postgres -d leave_duration_balance_test -v ON_ERROR_STOP=1 \
            -f tests/leave-duration-balance-breakdown-bootstrap.sql \
            -f supabase/migrations/20260917090100_leave_duration_balance_breakdown.sql \
            -f tests/leave-duration-balance-breakdown.sql

      - name: Test Victorian public-holiday workday scheduling
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres victorian_workday_test
          psql -h localhost -U postgres -d victorian_workday_test -v ON_ERROR_STOP=1 \
            -f tests/victorian-public-holiday-workdays-bootstrap.sql \
            -f supabase/migrations/20260917110640_victorian_public_holiday_workdays.sql \
            -f tests/victorian-public-holiday-workdays.sql

      - name: Test private payroll source-file retention
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres payroll_source_retention_test
          psql -h localhost -U postgres -d payroll_source_retention_test -v ON_ERROR_STOP=1 \
            -f tests/payroll-balance-source-retention-bootstrap.sql \
            -f supabase/migrations/20260918100000_payroll_balance_source_file_retention.sql \
            -f tests/payroll-balance-source-retention.sql

      - name: Test manager reporting-team leave Calendar permissions
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres manager_team_calendar_test
          psql -h localhost -U postgres -d manager_team_calendar_test -v ON_ERROR_STOP=1 -f tests/manager-team-calendar.sql

      - name: Test self-service leave notice policy
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres leave_notice_test
          psql -h localhost -U postgres -d leave_notice_test -v ON_ERROR_STOP=1 -f tests/leave-notice.sql

      - name: Test cross-team approved Calendar visibility and team labels
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres calendar_team_filters_test
          psql -h localhost -U postgres -d calendar_team_filters_test -v ON_ERROR_STOP=1 -f tests/calendar-team-filters.sql

      - name: Test idempotent leave submission and authorization
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres reliable_leave_submission_test
          psql -h localhost -U postgres -d reliable_leave_submission_test -v ON_ERROR_STOP=1 -f tests/reliable-leave-submission.sql

      - name: Test missed check-in catch-up and exclusive leases
        env:
          PGPASSWORD: synthetic-ci-only
        run: |
          createdb -h localhost -U postgres check_in_retry_catchup_test
          psql -h localhost -U postgres -d check_in_retry_catchup_test -v ON_ERROR_STOP=1 -f tests/check-in-retry-catchup.sql
